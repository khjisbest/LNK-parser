<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNK Parser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
            padding: 20px;
            background: white;
            color: black;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid #000;
            padding-bottom: 5px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        button {
            padding: 5px 10px;
            margin-left: 10px;
            background: white;
            border: 1px solid #000;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }

        button:hover {
            background: #f0f0f0;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-weight: bold;
            border-bottom: 1px dashed #000;
            padding: 5px 0;
            margin-bottom: 10px;
        }

        .row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-bottom: 8px;
            padding: 3px 0;
        }

        .label {
            text-align: right;
            padding-right: 10px;
        }

        .value {
            word-break: break-all;
            padding: 0;
        }

        .error {
            color: #8b0000;
            margin-bottom: 20px;
            padding: 10px;
            border-left: 2px solid #8b0000;
        }

        .strings-list {
            margin-left: 20px;
        }

        .string-item {
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px dotted #ccc;
        }
    </style>
</head>
<body>
    <h1>LNK Parser</h1>

    <input type="file" id="fileInput" accept="">
    <button onclick="clearResults()">Clear</button>

    <div id="errorContainer"></div>
    <div id="resultsContainer"></div>

    <script src="lnk-parser.js"></script>
</body>
</html>
